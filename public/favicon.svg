<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#131a15" />
      <stop offset="100%" stop-color="#060907" />
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#52b788" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#1b4332" stop-opacity="0.3" />
    </linearGradient>
    <radialGradient id="glow" cx="32" cy="32" r="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2d6a4f" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#2d6a4f" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="coreGlow" cx="30" cy="30" r="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2d6a4f" />
      <stop offset="100%" stop-color="#0d2417" />
    </radialGradient>
  </defs>

  <!-- Squircle Base with Emerald Border & Ambient Glow -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" />
  <circle cx="32" cy="32" r="26" fill="url(#glow)" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="url(#border)" stroke-width="2.5" />

  <!-- Inner Core Sphere -->
  <circle cx="32" cy="32" r="10.5" fill="url(#coreGlow)" stroke="#52b788" stroke-width="2.2" />

  <!-- Secondary Counter-Orbital Ring -->
  <ellipse cx="32" cy="32" rx="21" ry="9.5" fill="none" stroke="#2d6a4f" stroke-width="2" transform="rotate(45 32 32)" />

  <!-- Primary Orbital Ring -->
  <ellipse cx="32" cy="32" rx="21" ry="9.5" fill="none" stroke="#74c69d" stroke-width="2.5" transform="rotate(-30 32 32)" />

  <!-- Radiant Satellite Node with Glow -->
  <circle cx="47.5" cy="21.5" r="7" fill="#52b788" opacity="0.3" />
  <circle cx="47.5" cy="21.5" r="4.5" fill="#52b788" />
  <circle cx="47.5" cy="21.5" r="2" fill="#d8f3e3" />
</svg>
